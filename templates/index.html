<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AXIOM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --header-bg: #0a0f1e;
            --bot-bubble: #1e293b;
            --user-bubble: #065f46;
            --accent: #06b6d4;
            --text: #f1f5f9;
            --text-muted: #94a3b8;
            --input-bg: #1e293b;
            --border: #1e293b;
            --radius: 18px;
            --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        html, body {
            height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            -webkit-font-smoothing: antialiased;
        }
        #app {
            display: flex;
            flex-direction: column;
            height: 100%;
            max-width: 800px;
            margin: 0 auto;
            position: relative;
        }
        header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 18px 24px;
            background: var(--header-bg);
            border-bottom: 1px solid rgba(255,255,255,0.04);
            flex-shrink: 0;
        }
        header h1 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--accent);
            text-shadow: 0 0 20px rgba(6,182,212,0.15);
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #22c55e;
            box-shadow: 0 0 6px rgba(34,197,94,0.5);
        }
        .status-label {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
        }
        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scroll-behavior: smooth;
        }
        #chat::-webkit-scrollbar {
            width: 6px;
        }
        #chat::-webkit-scrollbar-track {
            background: transparent;
        }
        #chat::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 3px;
        }
        .message {
            max-width: 78%;
            padding: 12px 18px;
            border-radius: var(--radius);
            font-size: 15px;
            line-height: 1.55;
            word-wrap: break-word;
            animation: msg-in 0.25s ease-out;
        }
        @keyframes msg-in {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message.bot {
            align-self: flex-start;
            background: var(--bot-bubble);
            border-bottom-left-radius: 4px;
            color: var(--text);
        }
        .message.user {
            align-self: flex-end;
            background: var(--user-bubble);
            border-bottom-right-radius: 4px;
            color: var(--text);
        }
        .message.error {
            background: #450a0a;
            color: #fca5a5;
            border: 1px solid #7f1d1d;
        }
        .typing {
            align-self: flex-start;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 14px 18px;
            background: var(--bot-bubble);
            border-radius: var(--radius);
            border-bottom-left-radius: 4px;
            font-size: 14px;
            color: var(--text-muted);
            animation: msg-in 0.2s ease-out;
        }
        .typing .dots {
            display: flex;
            gap: 4px;
        }
        .typing .dots span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--text-muted);
            animation: dot-bounce 1.2s infinite;
        }
        .typing .dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing .dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes dot-bounce {
            0%, 80%, 100% { opacity: 0.3; transform: translateY(0); }
            40% { opacity: 1; transform: translateY(-4px); }
        }
        #input-area {
            display: flex;
            gap: 10px;
            padding: 16px 24px 24px;
            background: var(--bg);
            flex-shrink: 0;
            border-top: 1px solid rgba(255,255,255,0.04);
        }
        #input-area input {
            flex: 1;
            padding: 12px 18px;
            border: 1px solid #334155;
            border-radius: 12px;
            background: var(--input-bg);
            color: var(--text);
            font-family: var(--font);
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }
        #input-area input:focus {
            border-color: var(--accent);
        }
        #input-area input::placeholder {
            color: #64748b;
        }
        #input-area input:disabled {
            opacity: 0.5;
        }
        #send {
            width: 44px;
            height: 44px;
            border: none;
            border-radius: 12px;
            background: var(--accent);
            color: #0f172a;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: opacity 0.2s, transform 0.15s;
        }
        #send:hover:not(:disabled) {
            opacity: 0.9;
            transform: scale(1.05);
        }
        #send:active:not(:disabled) {
            transform: scale(0.95);
        }
        #send:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        #send svg {
            width: 18px;
            height: 18px;
        }
    </style>
</head>
<body>
    <div id="app">
        <header>
            <h1>AXIOM</h1>
            <span class="status-dot"></span>
            <span class="status-label">online</span>
        </header>
        <main id="chat"></main>
        <footer id="input-area">
            <input type="text" id="input" placeholder="Type a message..." autofocus>
            <button id="send" aria-label="Send message" disabled>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </footer>
    </div>
    <script>
        const storedName = {{ stored_name | tojson }};

        const chat = document.getElementById('chat');
        const input = document.getElementById('input');
        const sendBtn = document.getElementById('send');
        let waiting = false;

        function scrollBottom() {
            chat.scrollTop = chat.scrollHeight;
        }

        function addMessage(text, role) {
            const el = document.createElement('div');
            el.className = 'message ' + role;
            el.textContent = text;
            chat.appendChild(el);
            scrollBottom();
        }

        function removeTyping() {
            const t = document.querySelector('.typing');
            if (t) t.remove();
        }

        function showTyping() {
            removeTyping();
            const el = document.createElement('div');
            el.className = 'typing';
            el.innerHTML = 'AXIOM is typing<span class="dots"><span></span><span></span><span></span></span>';
            chat.appendChild(el);
            scrollBottom();
        }

        async function sendMessage(text) {
            if (waiting || !text.trim()) return;
            waiting = true;
            input.disabled = true;
            sendBtn.disabled = true;
            addMessage(text, 'user');
            input.value = '';
            showTyping();
            try {
                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                const data = await res.json();
                await new Promise(r => setTimeout(r, 500));
                removeTyping();
                if (data.response) {
                    addMessage(data.response, 'bot');
                } else if (data.error) {
                    addMessage(data.error, 'error');
                }
            } catch {
                removeTyping();
                addMessage('Something went wrong. Is the server running?', 'error');
            }
            waiting = false;
            input.disabled = false;
            sendBtn.disabled = false;
            input.focus();
        }

        input.addEventListener('input', () => {
            sendBtn.disabled = !input.value.trim() || waiting;
        });

        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage(input.value);
            }
        });

        sendBtn.addEventListener('click', () => sendMessage(input.value));

        function init() {
            if (storedName) {
                addMessage('Welcome back, ' + storedName + '! How can I help you today?', 'bot');
            } else {
                addMessage('Hello! I\'m AXIOM. How can I help you today?', 'bot');
            }
        }
        init();
    </script>
</body>
</html>
